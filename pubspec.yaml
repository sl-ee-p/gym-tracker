name: gym_app
description: "PlateLog: an offline-first workout tracker."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+8

environment:
  sdk: ^3.13.2
  # Stated explicitly, unusually for an app: flutter_body_atlas requires
  # >=3.38.0, and that requirement is what moved this project off the
  # long-held "Flutter 3.24.5 + AGP 8.1.0 + compileSdk 34" toolchain. Anyone
  # building this needs to know the floor is real, not incidental.
  flutter: ">=3.38.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # Database
  sqflite: ^2.3.0
  
  # State Management
  provider: ^6.1.1
  
  # Charts
  fl_chart: ^1.2.0
  
  # Utilities
  intl: ^0.20.3
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_native_splash: ^2.4.4

  # Saves the data export directly into the public Downloads folder on
  # Android (via MediaStore) without needing broad storage permissions.
  media_store_plus: ^0.1.3

  # Inter font for the app's typography. Using the runtime-fetch package
  # (rather than self-hosted .ttf assets) since the raw font files aren't
  # practically sourceable in this environment — see lib/theme/app_theme.dart.
  google_fonts: ^8.2.1

  # Plays the rest-timer completion chime.
  audioplayers: ^6.1.0

  # Generates the PDF workout-history report. Only the document builder is
  # needed, not the `printing` package's platform preview/share sheet — the
  # file goes to Downloads through the same MediaStore path as every other
  # export.
  pdf: ^3.11.0

  # Fires the rest-timer alert when the app is backgrounded. The in-app chime
  # above can't: frames stop, so the countdown is only noticed on resume.
  #
  # Was pinned to 18.0.1 because 19.x demands compileSdk 35 / AGP 8.6. The
  # toolchain now meets both, so this is caret-ranged again.
  #
  # timezone is flutter_local_notifications' scheduling dependency. The rest
  # timer only ever schedules a relative offset, which needs no real zone,
  # but the weekly workout/weigh-in reminders fire at a wall-clock time —
  # flutter_timezone supplies the device's zone so "18:00" means local 18:00
  # and stays there across DST changes.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Puts the workout heatmap on the Android home screen. Renders the app's own
  # WorkoutHeatmap painter to a PNG that a native AppWidgetProvider displays,
  # so there is one implementation of the grid rather than a second one in
  # Kotlin — which would have to re-derive the Material 3 tonal colours the
  # empty cells use.
  #
  # Was pinned to 0.7.0+1 while the project sat on Flutter 3.24.5: 0.8.0+
  # declare compileSdk 35 (which AGP 8.1.0 could not build) and 0.9.3+ require
  # Dart 3.10 / Flutter 3.38. All four moved together, as that pin predicted
  # they would have to.
  #
  # Note 0.8.0 changed renderFlutterWidget to default to the device pixel
  # ratio; HomeWidgetService already passes pixelRatio explicitly, so that
  # default is not load-bearing here.
  home_widget: ^0.9.4

  # The anatomical muscle map on the Exercises tab. Ships the front/back SVG
  # artwork (Ryan Graves, CC BY 4.0 — credited in Settings > About) and treats
  # its per-muscle SVG element IDs as a stable public contract, so this app
  # only has to map its own free-text `muscleGroups` strings onto those IDs
  # (lib/utils/muscle_region_mapping.dart). Hand-authoring ~28 aligned SVG
  # overlays was the alternative.
  #
  # This is the package that forced the toolchain move — see `environment` above.
  flutter_body_atlas: ^0.2.1

  # Picks a backup .json for Settings > Restore from backup. Goes through the
  # system document picker (Storage Access Framework on Android), so it needs
  # no storage permission.
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Runs real SQLite via FFI in `flutter test` (no emulator needed) — used
  # by the database migration tests.
  sqflite_common_ffi: ^2.3.0
  flutter_launcher_icons: ^0.14.4

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "ic_launcher"
  # No ios/ folder in this checkout yet; flip to true once it exists.
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0B6E77"
  # Artwork is already padded to the adaptive safe zone (tool/make_icon.py).
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  remove_alpha_ios: true

# Native Splash Screen configuration
flutter_native_splash:
  color: "#0B6E77"
  image: "assets/icon/splash_logo.png"
  color_dark: "#052E32"
  image_dark: "assets/icon/splash_logo.png"
  android_12:
    color: "#0B6E77"
    image: "assets/icon/splash_logo.png"
    color_dark: "#052E32"
    image_dark: "assets/icon/splash_logo.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/sounds/timer_complete.wav

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
